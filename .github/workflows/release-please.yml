# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# A repo that publishes something adds its own job here, gated on
# `needs.release-please.outputs.release-created`.
name: Release Please

on:
  push:
    branches:
      - main

jobs:
  release-please:
    name: Release Please
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@b8241bbd8b94ff37e36c43b3229453b65e8d1b51 # v0.15.0
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
